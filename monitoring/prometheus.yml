global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "booking-app1"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["app1:8080"]

  - job_name: "booking-app2"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["app2:8080"]

  - job_name: "booking-app3"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["app3:8080"]